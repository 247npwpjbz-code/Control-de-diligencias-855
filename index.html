<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Atestados - Policía Local Palma</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        h1 { color: #1a237e; text-align: center; }
        .btn { background: #007AFF; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-size: 16px; cursor: pointer; margin: 10px; }
        .btn-success { background: #34C759; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; }
        .status { position: fixed; top: 10px; right: 10px; padding: 10px 20px; border-radius: 20px; color: white; font-weight: bold; }
        .status.online { background: #34C759; }
        .status.offline { background: #FF9500; }
        .card { background: white; padding: 15px; margin: 10px 0; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <div id="status" class="status offline">📡 Offline</div>
    
    <div class="container">
        <h1>🚔 Policía Local C.P. 0855 - UVAC Palma</h1>
        
        <div id="mainView">
            <button class="btn btn-success" onclick="nuevoAtestado()" style="width:100%; font-size:20px;">+ Nuevo Atestado</button>
            <div id="listaAtestados"></div>
        </div>
        
        <div id="formView" style="display:none;">
            <h2>📋 Nuevo Atestado</h2>
            <div class="form-group">
                <label>Número de Atestado:</label>
                <input type="text" id="numAtestado" placeholder="Ej: 2024-001">
            </div>
            <div class="form-group">
                <label>Fecha:</label>
                <input type="date" id="fecha">
            </div>
            <div class="form-group">
                <label>Lugar:</label>
                <input type="text" id="lugar" placeholder="Calle, Km...">
            </div>
            <div class="form-group">
                <label>Matrículas:</label>
                <input type="text" id="matriculas" placeholder="1234ABC, 5678XYZ">
            </div>
            <button class="btn btn-success" onclick="guardarAtestado()" style="width:100%;">💾 Guardar</button>
            <button class="btn" onclick="volver()" style="width:100%;">↩️ Volver</button>
        </div>
    </div>

    <script>
        let atestados = [];
        let db = null;
        let isOnline = false;

        // Configuración Firebase - REEMPLAZA CON TUS DATOS
        const firebaseConfig = {
            apiKey: "AIzaSyC9fjYSmXfzdtDtrs-B0JfS9iotqDUPJY",
            authDomain: "atestados-policia-palma.firebaseapp.com",
            projectId: "atestados-policia-palma",
            storageBucket: "atestados-policia-palma.firebasestorage.app",
            messagingSenderId: "680050053111",
            appId: "1:680050053111:web:4101ea8b813ac07765e8f2"
        };

        // Inicializar Firebase
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            isOnline = true;
            document.getElementById('status').className = 'status online';
            document.getElementById('status').textContent = '📡 Online';
            console.log('✅ Firebase conectado');
            
            // Escuchar cambios
            db.collection('atestados').onSnapshot(snapshot => {
                atestados = [];
                snapshot.forEach(doc => {
                    atestados.push({ id: doc.id, ...doc.data() });
                });
                renderizarLista();
            });
        } catch(error) {
            console.log('⚠️ Firebase no configurado - Modo offline');
            document.getElementById('status').textContent = '📡 Offline (Sin Firebase)';
            cargarLocal();
        }

        function cargarLocal() {
            const guardados = localStorage.getItem('atestados');
            if(guardados) {
                atestados = JSON.parse(guardados);
                renderizarLista();
            }
        }

        function renderizarLista() {
            const lista = document.getElementById('listaAtestados');
            lista.innerHTML = '';
            
            if(atestados.length === 0) {
                lista.innerHTML = '<p style="text-align:center; color:#999;">No hay atestados</p>';
                return;
            }
            
            atestados.forEach(a => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>#${a.numAtestado}</h3>
                    <p>📅 ${a.fecha}</p>
                    <p>📍 ${a.lugar}</p>
                    <p>🚗 ${a.matriculas}</p>
                `;
                lista.appendChild(card);
            });
            
            if(db) {
                localStorage.setItem('atestados', JSON.stringify(atestados));
            }
        }

        function nuevoAtestado() {
            document.getElementById('mainView').style.display = 'none';
            document.getElementById('formView').style.display = 'block';
            document.getElementById('numAtestado').value = '';
            document.getElementById('fecha').value = new Date().toISOString().split('T')[0];
            document.getElementById('lugar').value = '';
            document.getElementById('matriculas').value = '';
        }

        function guardarAtestado() {
            const num = document.getElementById('numAtestado').value;
            const fecha = document.getElementById('fecha').value;
            const lugar = document.getElementById('lugar').value;
            const matriculas = document.getElementById('matriculas').value;
            
            if(!num || !fecha) {
                alert('❌ Completa al menos número y fecha');
                return;
            }
            
            const atestado = { numAtestado: num, fecha, lugar, matriculas };
            
            if(db) {
                db.collection('atestados').add(atestado).then(() => {
                    alert('✅ Guardado en la nube');
                    volver();
                });
            } else {
                atestados.push(atestado);
                localStorage.setItem('atestados', JSON.stringify(atestados));
                renderizarLista();
                alert('✅ Guardado localmente (sin Firebase)');
                volver();
            }
        }

        function volver() {
            document.getElementById('formView').style.display = 'none';
            document.getElementById('mainView').style.display = 'block';
        }
    </script>
</body>
</html>
